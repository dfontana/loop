[package]
name = "loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `loop` is a Rust keyword, so anything importing this library — the binary
# below, and the integration tests under `tests/` — spells it `r#loop`. Worth
# the friction to keep one name for the crate, the library, and the binary.
[lib]
name = "loop"
path = "src/lib.rs"

[[bin]]
name = "loop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
# Not a dev-dependency: `ledger` and `toolbox` use tempdirs at runtime, for
# atomic writes.
tempfile.workspace = true
thiserror.workspace = true

[features]
# Exposes `core::fixtures`, the typed ledger-event builders, to code outside
# the library. Off in a normal build: nothing shipped needs them.
testing = []

[dev-dependencies]
tempfile.workspace = true
# A dependency on ourselves, which is how cargo lets the integration tests
# under `tests/` link the library with a feature the binary does not get. They
# are a separate compilation unit, so without this `e2e.rs` cannot reach
# `fixtures` and goes back to hand-writing the ledger's wire format as format
# strings.
loop = { path = ".", features = ["testing"] }
