# ~/.loop/machines/standard-ticket.yaml
# A machine TEMPLATE — a starting point you copy into ./.loop/machine.yaml and
# fill in, not a machine that runs as-is. This is the plain implement → review →
# qa → pr spine for a code-only ticket with no pipeline/staging step. `loop init
# --template standard-ticket` copies this and drops you into `loop plan`.
#
# Everything it references (implement/review/qa/open-pr playbooks, ci tools) lives
# in the toolbox; the only per-ticket work is task.md, plan.md, qa_cases, and any
# tool allowlist tweaks. Placeholders are <ANGLE-BRACKETED>.

ticket: <TICKET-ID>

task: task.md
plan: plan.md

qa_cases:
  - id: <case-id>
    desc: <what "done and correct" means, in one checkable sentence>

defaults:
  provider: anthropic
  model: claude-sonnet-5
  thinking: medium
  session: fresh
  tools: [read, bash]

budgets:
  usd: 6
  wallclock_s: 3600
  max_transitions: 30

entry: implement
terminals: [done, blocked]

states:
  implement:
    playbook: implement
    thinking: high
    session: continue
    sessionKey: impl
    tools: [read, edit, write, bash]

  review:
    playbook: review
    thinking: high
    tools: [read, bash, agent, select_review_model]

  qa:
    playbook: qa
    thinking: high
    tools: [read, bash, ci_status]          # no edit/write — read-only QA

  open_pr:
    playbook: open-pr
    thinking: low
    tools: [read, bash, open_pr]

transitions:
  - from: implement
    to: review
    criteria: The plan's checklist is fully addressed and the build/tests are green.
    on_fail: retry
  - from: review
    to: implement
    when: "review.result == 'changes_requested'"
  - from: review
    to: qa
    when: "review.result == 'clean'"
  - from: qa
    to: implement
    when: "qa.result == 'fail'"
  - from: qa
    to: open_pr
    when: "qa.result == 'pass'"
  - from: open_pr
    to: done
    criteria: A pull request exists for this branch with a populated description.

loops:
  fix:
    states: [qa, implement, review]
    max_cycles: 4
    on_exhausted: escalate
