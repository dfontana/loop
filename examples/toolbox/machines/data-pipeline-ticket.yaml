# ~/.loop/machines/data-pipeline-ticket.yaml
# A machine TEMPLATE for a data-pipeline change validated against staging: it adds
# a deploy + real-vs-transient QA loop and an optional contract check on top of
# the standard spine. PROJ-1487's ../local/machine.yaml is this template, filled
# in (churn_score task/plan, the bespoke validate_contract stage). Copy with
# `loop init --template data-pipeline-ticket`, then specialize.
#
# References toolbox playbooks (implement/review/qa/debug-spark/open-pr) and the
# spark + staging tools. Placeholders are <ANGLE-BRACKETED>. The bespoke bits a
# real ticket usually adds — a local validate-contract playbook, extra qa_cases —
# are called out in comments rather than baked in.

ticket: <TICKET-ID>

task: task.md
plan: plan.md

qa_cases:
  - id: pipeline
    desc: <the job populates the new/changed column for all target rows, backfilled as required>
  # add a `contract` case (and a local validate-contract playbook) if the change
  # also has an API surface — see ../../local for the PROJ-1487 example.

defaults:
  provider: anthropic
  model: claude-sonnet-5
  thinking: medium
  session: fresh
  tools: [read, bash]

budgets:
  usd: 8
  wallclock_s: 5400
  max_transitions: 40

entry: implement
terminals: [done, blocked]

states:
  implement:
    playbook: implement
    thinking: high
    session: continue
    sessionKey: impl
    tools: [read, edit, write, bash, spark_build]

  review:
    playbook: review
    thinking: high
    tools: [read, bash, agent, select_review_model]

  qa_staging:
    playbook: qa
    thinking: high
    tools: [read, bash, staging_deploy, spark_run, fetch_job_output]   # no edit/write

  debug:
    playbook: debug-spark
    thinking: high
    session: continue
    sessionKey: impl
    tools: [read, edit, bash, spark_build, use_playbook]               # use_playbook → debug-transient

  open_pr:
    playbook: open-pr
    thinking: low
    tools: [read, bash, open_pr]

transitions:
  - from: implement
    to: review
    criteria: The plan's checklist is fully addressed, the build is green, and no TODO/FIXME remain.
    on_fail: retry
  - from: review
    to: implement
    when: "review.result == 'changes_requested'"
  - from: review
    to: qa_staging
    when: "review.result == 'clean'"
  - from: qa_staging
    to: qa_staging
    when: "qa.result == 'fail' && qa.error_class == 'transient'"
    backoff_s: 30
    on_fail: abort
  - from: qa_staging
    to: debug
    when: "qa.result == 'fail' && qa.error_class != 'transient'"
  - from: qa_staging
    to: open_pr                    # a ticket with an API surface routes to a validate_contract stage first
    when: "qa.result == 'pass'"
  - from: debug
    to: qa_staging
    criteria: A concrete fix was applied and the build is green.
    on_fail: retry
  - from: open_pr
    to: done
    criteria: A pull request exists for this branch with a populated description.

loops:
  qa:
    states: [qa_staging, debug]
    max_cycles: 4
    on_exhausted: escalate
  qa_transient:
    states: [qa_staging]
    max_cycles: 3
    on_exhausted: escalate

navigator:
  max_invocations: 5
  model: claude-haiku-4-5
  thinking: low

judge:
  model: claude-haiku-4-5
  thinking: low
