# examples/tools/staging.yaml  →  ~/.config/loop/tools/staging.yaml
# Deploy + contract-check tools. Note the safety guardrails: env is validated to
# never be prod, the namespace is cycle-scoped (idempotent re-entry), and the
# deploy token is a hidden parameter so it never reaches agent context or the ledger.

staging_deploy:
  description: >
    Deploy the current branch to this ticket+cycle's isolated staging namespace.
    Idempotent: re-running for the same cycle updates the existing deployment.
  parameters:
    branch:
      type: string
      description: Git branch to deploy
      validationCmd: git rev-parse --verify "$1" >/dev/null 2>&1
    env:
      type: string
      description: "Target environment (dev or staging only — never prod)"
      validationCmd: echo "$1" | grep -qxE 'dev|staging'
  hiddenParameters:
    ns:    { valueFromCmd: echo "loop-$TICKET_ID-$CYCLE" }
    token: { valueFromCmd: pass show staging/deploy-token }
  commandTemplate: |
    stagectl deploy --branch $BRANCH --env $ENV --namespace $NS \
      --token $TOKEN --wait --json
  timeout: 600

contract_check:
  description: >
    Hit the deployed staging API for a sample account and validate the response
    against the committed OpenAPI schema. Emits contract.result for gating.
  parameters:
    path:
      type: string
      description: "API path to check (e.g. /accounts/42)"
      validationCmd: echo "$1" | grep -qE '^/[A-Za-z0-9/_:-]+$'
  hiddenParameters:
    base: { valueFromCmd: echo "https://loop-$TICKET_ID-$CYCLE.staging.internal" }
  commandTemplate: |
    curl -sf "$BASE$PATH" \
      | openapi-validate --spec ./openapi.yaml --path "$PATH" --json \
      && echo 'LOOP_VARS {"contract":{"result":"match"}}' \
      || { echo 'LOOP_VARS {"contract":{"result":"mismatch"}}'; exit 1; }
  timeout: 120

open_pr:
  description: >
    Open (or update, if one already exists) the pull request for the current
    branch. Idempotent — safe to re-run on crash-resume.
  parameters:
    title:
      type: string
      description: PR title
    body_file:
      type: string
      description: Path to a file containing the PR body (assembled from the ledger digest)
      validationCmd: test -f "$1"
  commandTemplate: |
    existing=$(gh pr view --json url -q .url 2>/dev/null) && \
      { echo "PR already exists: $existing"; \
        gh pr edit --title "$TITLE" --body-file "$BODY_FILE"; } || \
      gh pr create --title "$TITLE" --body-file "$BODY_FILE" --fill
  timeout: 120
