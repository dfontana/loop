# examples/tools/spark.yaml  →  installed at ~/.config/loop/tools/spark.yaml
# scoped-tools definitions for the Spark pipeline. Same format as your
# pi-extensions/extensions/scoped-tools README. The agent sees only the tool
# schema and stdout — never the templates, tokens, or cluster coordinates.
#
# Convention: QA-relevant tools print a final `LOOP_VARS {json}` line that the
# harness scrapes into a `vars_set` ledger event. That line — backed by a real
# exit code — is what `when` guards gate on, so the model can't fake a pass.

spark_build:
  description: >
    Build/compile the Spark pipeline for the current working tree and run its
    fast unit checks. Emits build status for gating.
  parameters: {}
  hiddenParameters:
    project_root: { valueFromCmd: git rev-parse --show-toplevel }
  commandTemplate: |
    cd $PROJECT_ROOT && \
    if sbt -batch compile test:compile 2>build.log; then \
      echo "LOOP_VARS {\"build\":{\"status\":\"pass\",\"id\":\"b-$(date +%s)\"}}"; \
    else \
      echo "LOOP_VARS {\"build\":{\"status\":\"fail\"}}"; tail -40 build.log; exit 1; \
    fi
  timeout: 600

spark_run:
  description: >
    Run a named Spark job against the ticket's staging namespace and wait for it
    to finish. Returns the job id and final status.
  parameters:
    job:
      type: string
      description: "Job name to run (e.g. retention, backfill)"
      validationCmd: echo "$1" | grep -qxE 'retention|backfill|engagement'
  hiddenParameters:
    ns:    { valueFromCmd: echo "loop-$TICKET_ID-$CYCLE" }        # cycle-scoped
    token: { valueFromCmd: pass show spark/run-token }
  commandTemplate: |
    sparkctl run --job $JOB --namespace $NS --token $TOKEN --wait --json
  timeout: 1200

fetch_job_output:
  description: >
    Fetch a completed Spark job's output sample and classify the run outcome
    (pass / transient failure / real failure) for gating.
  parameters:
    job_id:
      type: string
      description: The job id returned by spark_run
      validationCmd: echo "$1" | grep -qE '^[a-z0-9-]+$'
  hiddenParameters:
    token: { valueFromCmd: pass show spark/run-token }
  # classify.sh inspects the job's exit reason + output and prints one
  # LOOP_VARS line with qa.result + qa.error_class. Kept in a script so the
  # taxonomy (executor-lost/timeout → transient; schema/assertion → real) is
  # versioned and testable, not embedded in a prompt.
  commandTemplate: |
    sparkctl fetch --job-id $JOB_ID --token $TOKEN --sample 50 --json \
      | sh "$PI_AGENT_DIR/bin/classify-spark.sh"
  timeout: 300
