# examples/loop.config.yaml  →  ~/.loop/loop.config.yaml
# Global toolbox defaults. A per-ticket machine.yaml overrides any of these.
# Kept separate from any single ticket so the toolbox stays portable.

provider: anthropic

# Default Worker model/thinking when a state doesn't specify.
worker:
  model: claude-sonnet-5
  thinking: medium

# The cheap agents that run the guards and reconciliation. Deliberately small +
# low thinking — they judge and route, they don't do the work.
judge:
  model: claude-haiku-4-5
  thinking: low
navigator:
  model: claude-haiku-4-5
  thinking: low
  max_invocations: 5            # per run; cap to avoid ping-pong

# Baseline tools every stage gets before its own allowlist is added.
default_tools: [read, bash]

# Where the toolbox lives (playbooks/, tools/, machines/, ext/).
toolbox_dir: ~/.loop

# Two kinds of extension reach a Worker spawn — don't conflate them:
#
# 1. loop's OWN harness extensions, vendored in ext/ and `-e`-injected per spawn.
#    These don't exist outside loop; the harness owns them.
inject_extensions:
  - ~/.loop/ext/transition-tool.ts   # the Worker's transition tool
  # verdict-tool.ts / choose-tool.ts are injected into the Judge / Navigator
  # spawns respectively, not the Worker (see docs/05-orchestration.md).
#
# 2. EXISTING pi-extensions (installed packages: ~/opencode/pi-extensions), not
#    files loop ships. The harness activates them and points them at the toolbox
#    by exporting PI_AGENT_DIR=$toolbox_dir for each spawn, so:
#      - `scoped-tools` reads $PI_AGENT_DIR/scoped-tools.yaml (the harness merges
#        tools/*.yaml into it — see docs/04-toolbox.md).
#      - `mcp` reads $PI_AGENT_DIR/mcp.json (tools/mcp.json here).
#    A stage opts into either by listing `mcp` / the scoped-tool names in `tools:`.
pi_extensions:
  - scoped-tools           # ~/opencode/pi-extensions/extensions/scoped-tools
  - mcp                    # ~/opencode/pi-extensions/extensions/mcp
  - review-model-selector  # provides select_review_model, used by the `review` stage

# Global guardrails. A machine's `budgets:` block tightens (never loosens) these.
budgets:
  usd: 15
  wallclock_s: 7200
  max_transitions: 60

# How much prior context each stage sees. `digest` = rolling summary the harness
# assembles (default). `full` = every worker_output verbatim (expensive).
context: digest
digest_last_n: 8                  # include the last N transitions verbatim in the digest

transition_mode: constrained      # constrained | open  (see docs/05-orchestration.md)
