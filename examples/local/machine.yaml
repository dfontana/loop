# examples/machine.yaml
# The per-ticket machine for PROJ-1487. The ticket's unique files are just this
# machine + its prose (task.md, plan.md) + any bespoke local playbook
# (playbooks/validate-contract.md) + the ledger it produces. Everything else it
# references — generic playbooks, tools — lives in the portable toolbox at
# ~/.loop/ and is reused untouched.
#
# `loop validate machine.yaml`  → lints the graph + resolves every reference
# `loop run`                     → drives it to a terminal
# See docs/06-example-walkthrough.md for the run this produces.

ticket: PROJ-1487

# Prose lives in markdown, referenced by the machine (paths are relative to this
# file). The harness loads their contents into $TASK / $PLAN for every stage that
# templates them. An inline `task: |` block is still allowed for throwaway tickets.
task: task.md
plan: plan.md

# QA criteria — what "done and correct" means. Referenced by stage criteria/prompts.
qa_cases:
  - id: pipeline
    desc: The retention job populates churn_score for all active accounts, 30d backfilled.
  - id: contract
    desc: GET /accounts/:id returns churn_score as a number matching the OpenAPI schema.

defaults:
  provider: anthropic
  model: claude-sonnet-5
  thinking: medium
  session: fresh
  tools: [read, bash]          # baseline every stage gets; states add to this

budgets:
  usd: 8
  wallclock_s: 5400            # 90 min
  max_transitions: 40

entry: implement
terminals: [done, blocked]

# ── States ────────────────────────────────────────────────────────────────
# Every stage's prompt IS its `playbook:` — a markdown file resolved local-first
# (./.loop/playbooks/) then toolbox (~/.loop/playbooks/). So a generic stage
# names a toolbox playbook; a ticket-specific stage drops a local .md of its own.
states:
  implement:
    playbook: implement                       # toolbox: ~/.loop/playbooks/implement.md
    thinking: high
    session: continue                         # share a session with `debug` across fix cycles
    sessionKey: impl
    tools: [read, edit, write, bash, spark_build]

  review:
    playbook: review                          # this playbook == the run-review skill
    thinking: high
    tools: [read, bash, agent, select_review_model]   # Agent tools fan out sub-reviewers; select_review_model picks them (review-model-selector ext)

  qa_staging:
    playbook: qa
    thinking: high
    tools: [read, bash, staging_deploy, spark_run, fetch_job_output]   # NO edit/write — read-only QA

  debug:
    playbook: debug-spark
    thinking: high
    session: continue
    sessionKey: impl                          # remembers what implement built
    tools: [read, edit, bash, spark_build, use_playbook]               # can consult debug-transient

  validate_contract:
    playbook: validate-contract                # LOCAL: ./.loop/playbooks/validate-contract.md
    thinking: medium                           # bespoke prompt — this endpoint, these fields
    tools: [read, bash, staging_deploy, contract_check]

  open_pr:
    playbook: open-pr
    thinking: low
    tools: [read, bash, open_pr]

# ── Transitions ─────────────────────────────────────────────────────────────
# structural guard: only these edges exist. Then `when` (cheap, deterministic),
# then `criteria` (LLM Judge). on_fail: retry | route | abort.
transitions:
  - from: implement
    to: review
    criteria: |
      The plan's four items are all addressed in the diff, `spark_build` is
      green, and no TODO/FIXME markers remain in changed files.
    on_fail: retry

  - from: review
    to: implement
    when: "review.result == 'changes_requested'"

  - from: review
    to: qa_staging
    when: "review.result == 'clean'"

  # QA fail, transient → retry the same stage with backoff (no code touched)
  - from: qa_staging
    to: qa_staging
    when: "qa.result == 'fail' && qa.error_class == 'transient'"
    backoff_s: 30
    on_fail: abort

  # QA fail, real → debug
  - from: qa_staging
    to: debug
    when: "qa.result == 'fail' && qa.error_class != 'transient'"

  # QA pass → validate the API contract
  - from: qa_staging
    to: validate_contract
    when: "qa.result == 'pass'"

  - from: debug
    to: qa_staging
    criteria: "A concrete fix was applied and `spark_build` is green."
    on_fail: retry

  - from: validate_contract
    to: implement
    when: "contract.result == 'mismatch'"

  - from: validate_contract
    to: open_pr
    when: "contract.result == 'match'"

  - from: open_pr
    to: done
    criteria: "A pull request exists for this branch with a populated description."

# ── Loops ───────────────────────────────────────────────────────────────────
loops:
  qa:
    states: [qa_staging, debug]
    max_cycles: 4
    on_exhausted: escalate        # → `blocked` terminal + notify
  qa_transient:
    states: [qa_staging]          # the self-loop
    max_cycles: 3
    on_exhausted: escalate

navigator:
  max_invocations: 5              # cap reconciliations to avoid ping-pong
  model: claude-haiku-4-5
  thinking: low

judge:
  model: claude-haiku-4-5
  thinking: low
