[workspace]
resolver = "3"
members = [
    "crates/loop-core",
    "crates/loop-ledger",
    "crates/loop-fennel",
    "crates/loop-toolbox",
    "crates/loop-runner",
    "crates/loop-engine",
    "crates/loop-cli",
    "crates/mock-pi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
loop-core = { path = "crates/loop-core" }
loop-ledger = { path = "crates/loop-ledger" }
loop-fennel = { path = "crates/loop-fennel" }
loop-toolbox = { path = "crates/loop-toolbox" }
loop-runner = { path = "crates/loop-runner" }
loop-engine = { path = "crates/loop-engine" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
hex = "0.4"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
